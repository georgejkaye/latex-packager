name: Latex packager
description: Package latex project for distribution
inputs:
  input-dir:
    description: The directory the project lives in
  main:
    description: The basename of the main file
  project-name:
    description: The name of the project, to be used as the name of the produced packages
  engine:
    description: The LaTeX engine to use to compile the project (pdflatex/lualatex/xelatex)
    required: false
    default: pdflatex
  shell-escape:
    description: Whether you would like to enable shell escape
    required: false
    default: false
  chapters:
    description: Whether you would like individual chapter pdfs (requires `numbered` option to be used with bookmarks package)
    required: false
    default: false
  replace-tikzfigs:
    description: Replace tikzfig invocations with generated pdfs
    required: false
    default: false
runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.input-dir }}
    - ${{ inputs.main }}
    - ${{ inputs.project-name }}
    - ${{ inputs.engine }}
    - ${{ inputs.shell-escape }}
    - ${{ inputs.chapters }}
    - ${{ inputs.replace-tikzfigs }}